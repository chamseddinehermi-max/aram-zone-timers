name: timer

on:
  schedule:
    # GitHub's schedule is best effort: asked for every 30 minutes, it ran 3 times in 12
    # hours. Asking every 5 minutes gives it far more chances to wake up on time.
    # post.py decides whether an ad is due; most runs post nothing.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: timer
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Post the ads that are due
        run: python3 post.py
        env:
          WEBHOOK_GENCHAT: ${{ secrets.WEBHOOK_GENCHAT }}
          WEBHOOK_LFMAYHEM: ${{ secrets.WEBHOOK_LFMAYHEM }}
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state"
            git pull --rebase
            git push
          fi
      - name: Switch the timer off once every ad has ended
        if: always()
        run: if [ -f DONE ]; then gh workflow disable timer.yml; fi
        env:
          GH_TOKEN: ${{ github.token }}
